services:
  # 1. Cơ sở dữ liệu Không gian (PostGIS)
  db:
    image: postgis/postgis:15-3.3
    container_name: wildfire_postgis
    restart: unless-stopped
    environment:
      POSTGRES_USER: wildfire_admin
      POSTGRES_PASSWORD: wildfire_password
      POSTGRES_DB: wildfire_db
    ports:
      - "5433:5432"
    volumes:
      - ./volumes/db-data:/var/lib/postgresql/data
      # Mount thư mục chứa file SQL để tự động khởi tạo bảng khi chạy lần đầu
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "wildfire_admin", "-d", "wildfire_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wildfire_net

  # Redis cache
  redis:
    image: redis:7-alpine
    container_name: wildfire_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./volumes/redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wildfire_net

  # 2. Máy chủ Bản đồ GIS (GeoServer)
  geoserver:
    image: kartoza/geoserver:2.23.2
    container_name: wildfire_geoserver
    restart: unless-stopped
    environment:
      - GEOSERVER_ADMIN_PASSWORD=admin
      - GEOSERVER_ADMIN_USER=admin
      - INITIAL_MEMORY=2G
      - MAXIMUM_MEMORY=4G
    ports:
      - "8080:8080"
    volumes:
      - ./volumes/geoserver-data:/opt/geoserver/data_dir
    depends_on:
      - db
    networks:
      - wildfire_net

  # 3. Message Broker (Mosquitto MQTT)
  mqtt:
    image: eclipse-mosquitto:2
    container_name: wildfire_mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001" # WebSockets
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./volumes/mosquitto-data:/mosquitto/data
      - ./volumes/mosquitto-log:/mosquitto/log
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-h", "localhost", "-t", "test", "-m", "test"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wildfire_net

  # 4. Data Ingestion Worker (Nhận data từ MQTT lưu vào DB)
  ingestion_worker:
    build: ./ingestion_worker
    container_name: wildfire_ingestion
    restart: unless-stopped
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=wildfire_db
      - DB_USER=wildfire_admin
      - DB_PASSWORD=wildfire_password
      - MQTT_BROKER=mqtt
      - MQTT_PORT=1883
      - MQTT_TOPIC=wildfire/alerts/#
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_healthy
    networks:
      - wildfire_net

  # 5. Backend API (FastAPI cung cấp dữ liệu cho Frontend)
  backend_api:
    build: ./backend_api
    container_name: wildfire_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=wildfire_db
      - DB_USER=wildfire_admin
      - DB_PASSWORD=wildfire_password
      - REDIS_URL=redis://redis:6379
      - MQTT_HOST=mqtt
      - MQTT_PORT=1883
      - JWT_SECRET_KEY=change-me-in-production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mqtt:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wildfire_net

  nginx:
    image: nginx:alpine
    container_name: wildfire_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend_api
    networks:
      - wildfire_net

  # 6. Frontend Web Server (Nginx)
  frontend_web:
    build: ./frontend-app
    container_name: wildfire_frontend
    restart: unless-stopped
    ports:
      - "8082:80"
    depends_on:
      - backend_api
    networks:
      - wildfire_net

networks:
  wildfire_net:
    driver: bridge
